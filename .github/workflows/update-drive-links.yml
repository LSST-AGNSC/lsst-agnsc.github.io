# Fills _data/files.yml with direct Google Drive links from the two folder links in _data/drive.yml.
# Runs when drive.yml changes, weekly, or on demand (Actions tab > Update Drive links > Run workflow).
name: Update Drive links
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths: ["_data/drive.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Resolve file links from the Drive folders
        run: python3 tools/drive_links.py
      - name: Commit the updated links
        run: |
          if git diff --quiet -- _data/files.yml; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/files.yml
          git commit -m "Update Google Drive file links"
          git push
